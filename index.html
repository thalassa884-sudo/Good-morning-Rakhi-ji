<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" id="themeMeta" content="#060814"/>
<meta name="description" content="A small interactive morning, made for Rakhi."/>
<title>Good Morning, Rakhi</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond/400-italic.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cormorant-garamond/500-italic.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jost/300.css"/>
<style>
/* ============ base ============ */
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  height:100vh;height:100dvh;overflow:hidden;
  background:#04060f;color:#e8e6ee;
  font-family:'Jost',system-ui,sans-serif;font-weight:300;
  touch-action:none;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  -webkit-text-size-adjust:100%;
}
#scene{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;--beat:1900ms}
#scene>*{position:absolute}

/* ============ sky layers ============ */
.sky{inset:0;pointer-events:none;will-change:opacity}
.sky-night{
  background:
    radial-gradient(120% 55% at 50% 108%, rgba(86,64,124,.30), transparent 62%),
    linear-gradient(180deg,#030510 0%,#080c22 34%,#101736 62%,#1d2249 83%,#2b2b58 100%);
}
.sky-dawn{opacity:0;transition:opacity 5.2s cubic-bezier(.4,.1,.2,1) .25s;background:
  radial-gradient(95% 44% at 50% 104%, rgba(255,170,110,.45), transparent 62%),
  linear-gradient(180deg,#141634 0%,#34295b 28%,#6d3e64 54%,#b26169 74%,#e6976c 90%,#f8bf86 100%);
}
.sky-day{opacity:0;transition:opacity 6.5s ease;background:
  radial-gradient(100% 42% at 50% 103%, rgba(255,215,150,.55), transparent 60%),
  linear-gradient(180deg,#9bc7de 0%,#bcdce8 32%,#e9e7d8 60%,#f9ecd4 80%,#ffe2b0 100%);
}
.ph-dawn .sky-dawn{opacity:1}
.ph-morning .sky-day{opacity:1}
.vignette{inset:0;pointer-events:none;opacity:.85;transition:opacity 5s ease .5s;
  background:radial-gradient(135% 100% at 50% 38%, transparent 55%, rgba(0,0,10,.42) 100%)}
.ph-dawn .vignette{opacity:0}

/* ============ stars & meteors ============ */
.stars,.meteors{inset:0;width:100%;height:100%;pointer-events:none;transition:opacity 3.6s ease .15s}
.ph-dawn .stars,.ph-dawn .meteors{opacity:0}
.star{fill:#e2e8ff}
.star-tw{animation:tw var(--td,5s) ease-in-out var(--tdel,0s) infinite}
@keyframes tw{0%,100%{opacity:var(--o,.6)}50%{opacity:calc(var(--o,.6)*.3)}}

/* ============ horizon glow / sun / clouds ============ */
.horizon-glow{left:58%;top:79%;width:185vw;height:112vh;pointer-events:none;
  transform:translate(-50%,-50%) scale(.62);opacity:0;
  background:radial-gradient(closest-side, rgba(255,178,110,.55), rgba(255,148,108,.16) 46%, transparent 72%);
  transition:opacity 5s ease 1.2s, transform 9s cubic-bezier(.2,.6,.2,1) 1.2s}
.ph-dawn .horizon-glow{opacity:.9;transform:translate(-50%,-50%) scale(1)}
.ph-morning .horizon-glow{opacity:.7}

.sun-wrap{left:58%;top:23%;width:clamp(58px,16vw,88px);aspect-ratio:1;pointer-events:none;
  transform:translate(-50%,-50%) translateY(58vh) scale(.92);opacity:0;
  transition:transform 10s cubic-bezier(.16,.65,.2,1), opacity 2.8s ease .4s;
  will-change:transform,opacity}
.sun-wrap.rise{transform:translate(-50%,-50%) translateY(0) scale(1);opacity:1}
.sun-halo{position:absolute;inset:-120%;pointer-events:none;
  background:radial-gradient(circle, rgba(255,214,150,.55), rgba(255,190,120,.16) 42%, transparent 68%);
  animation:halo 9s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.sun-svg{position:absolute;inset:0;width:100%;height:100%}

.cloud{pointer-events:none;border-radius:50%;opacity:0;transition:opacity 6s ease 1s;
  background:radial-gradient(closest-side, rgba(255,252,246,.78), rgba(255,252,246,0))}
.ph-morning .cloud{opacity:var(--co,.4)}
.c1{top:15%;left:5%;width:46vw;height:9vh;--co:.36;animation:drift 72s ease-in-out infinite alternate}
.c2{top:8%;right:3%;width:34vw;height:7vh;--co:.30;animation:drift 92s ease-in-out infinite alternate-reverse}
.c3{top:31%;right:11%;width:24vw;height:6vh;--co:.20;animation:drift 82s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-2.4vw)}to{transform:translateX(2.4vw)}}

/* ============ hills & haze ============ */
.hills{left:0;right:0;bottom:0;height:24vh;pointer-events:none}
.hills svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hills-warm{opacity:0;transition:opacity 5.5s ease 1.5s}
.ph-morning .hills-warm{opacity:.94}
.haze{left:0;right:0;bottom:0;height:30vh;pointer-events:none;opacity:0;transition:opacity 6s ease 2s;
  background:linear-gradient(180deg, rgba(255,240,220,0), rgba(255,236,210,.55) 78%, rgba(255,236,210,.66))}
.ph-morning .haze{opacity:.5}

/* ============ heart ============ */
.heart-anchor{left:50%;top:38%;width:clamp(118px,34vw,176px);aspect-ratio:1;
  transform:translate(-50%,-50%);pointer-events:none;
  transition:transform 3.9s cubic-bezier(.45,.1,.2,1), opacity 3.4s ease .3s}
.ph-dawn .heart-anchor{transform:translate(-50%,-50%) translateY(-30vh) scale(.86);opacity:0}
.heart-parallax{position:absolute;inset:0;will-change:transform}
.heart-glow{position:absolute;inset:-46%;pointer-events:none;will-change:transform,opacity;
  background:radial-gradient(circle, rgba(236,96,128,.42), rgba(236,96,128,.13) 46%, transparent 70%);
  animation:glowbeat var(--beat) ease-in-out infinite}
@keyframes glowbeat{0%,30%,100%{transform:scale(1);opacity:.78}7%{transform:scale(1.05);opacity:1}13%{transform:scale(1);opacity:.85}19%{transform:scale(1.11);opacity:1}}
.heart-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.float{animation:floaty 6.8s ease-in-out infinite;will-change:transform}
@keyframes floaty{0%,100%{transform:translateY(0)}42%,58%{transform:translateY(-7px)}}
.beat{transform-origin:100px 94px;animation:beat var(--beat) cubic-bezier(.45,.05,.35,1) infinite;will-change:transform}
@keyframes beat{0%{transform:scale(1)}7%{transform:scale(1.045)}12%{transform:scale(.996)}19%{transform:scale(1.062)}30%{transform:scale(1)}100%{transform:scale(1)}}
.ripple,.ripple-strong{fill:none;transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
.ripple{stroke:rgba(240,140,165,.5);stroke-width:1;opacity:0;
  animation:ripple 3.8s cubic-bezier(.2,.5,.35,1) infinite}
.ripple.r2{animation-delay:1.9s}
@keyframes ripple{0%{transform:scale(.42);opacity:0}7%{opacity:.5}70%{opacity:.12}100%{transform:scale(1.9);opacity:0}}
.ripple-strong{stroke:rgba(248,152,174,.85);stroke-width:1.3;opacity:0}
.ripple-set{transition:opacity 2s ease .4s}
.ph-dawn .ripple-set{opacity:0}
.heart-hit{position:absolute;inset:-30%;border-radius:50%;background:transparent;border:0;
  cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.heart-hit:focus{outline:none}
.heart-hit:focus-visible{outline:1.5px solid rgba(226,232,255,.6);outline-offset:8px}
.ph-dawn .heart-hit{pointer-events:none}

/* ignition flash */
.ignition{left:50%;top:38%;width:120vmin;height:120vmin;transform:translate(-50%,-50%);
  opacity:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle, rgba(255,226,232,.95), rgba(255,178,192,.28) 30%, transparent 60%)}

/* ============ birds ============ */
.birds{inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity 2s ease}
.birds.on{opacity:1}
.bird-track{animation:fly var(--fdur,14s) cubic-bezier(.42,.1,.48,1) var(--fdel,0s) both;
  animation-play-state:paused;will-change:transform}
.birds.on .bird-track{animation-play-state:running}
@keyframes fly{from{transform:translateX(var(--x0,-80px))}to{transform:translateX(var(--x1,480px))}}
.birds.on .bird-bob{animation:bob var(--bd,3s) ease-in-out var(--bdel,0s) infinite alternate}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
.bird-wing{fill:none;stroke:rgba(43,42,56,.82);stroke-width:1.7;stroke-linecap:round;
  transform-box:fill-box;transform-origin:50% 85%}
.birds.on .bird-wing{animation:flap var(--wd,.85s) cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.25)}}

/* ============ cue & message ============ */
.cue{left:50%;top:calc(38% + clamp(86px,23vw,118px));transform:translate(-50%,0);
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;letter-spacing:.06em;
  color:rgba(216,224,248,.85);white-space:nowrap;opacity:0;pointer-events:none;
  animation:cuein 2.4s cubic-bezier(.2,.6,.2,1) 3.4s forwards}
@keyframes cuein{from{opacity:0;transform:translate(-50%,10px)}to{opacity:.85;transform:translate(-50%,0)}}
.ph-touch .cue{animation:none;opacity:0;transition:opacity .8s ease}

.message{left:50%;top:56%;transform:translate(-50%,-50%);text-align:center;
  width:min(86vw,520px);pointer-events:none}
.m-title{display:flex;flex-direction:column;align-items:center;font-weight:300}
.m-label{display:block;font-size:clamp(10px,2.8vw,13px);letter-spacing:.42em;text-transform:uppercase;
  color:#7c5c4e;padding-left:.42em;opacity:0;transform:translateY(14px);filter:blur(5px);
  transition:opacity 1.9s ease .25s, transform 1.9s cubic-bezier(.2,.6,.2,1) .25s, filter 1.9s ease .25s}
.m-name{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
  font-size:clamp(44px,12.5vw,64px);line-height:1.05;color:#4a323e;margin-top:14px;
  opacity:0;transform:translateY(16px);filter:blur(7px);
  transition:opacity 2.3s ease .7s, transform 2.3s cubic-bezier(.2,.6,.2,1) .7s, filter 2.3s ease .7s}
.m-divider{display:block;margin:18px auto 0;width:50px;opacity:0;transition:opacity 1.2s ease 1.6s}
.m-divider path{fill:none;stroke:#b25a70;stroke-width:1.7;stroke-linecap:round;
  stroke-dasharray:120;stroke-dashoffset:120;transition:stroke-dashoffset 1.6s cubic-bezier(.4,.1,.3,1) 1.8s}
.ph-message .m-label,.ph-message .m-name{opacity:1;transform:translateY(0);filter:blur(0)}
.ph-message .m-divider{opacity:.9}
.ph-message .m-divider path{stroke-dashoffset:0}

/* ============ fullscreen control ============ */
.fs-btn{top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);
  width:44px;height:44px;display:grid;place-items:center;background:transparent;border:0;padding:0;
  color:rgba(226,232,252,.58);cursor:pointer;z-index:30;transition:color 2.5s ease}
.fs-btn:hover{color:rgba(236,240,255,.95)}
.fs-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fs-btn:focus{outline:none}
.fs-btn:focus-visible{outline:1.5px solid currentColor;outline-offset:2px;border-radius:8px}
.ph-morning .fs-btn{color:rgba(74,50,62,.58)}
.ph-morning .fs-btn:hover{color:rgba(74,50,62,.92)}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ reduced motion ============ */
@media (prefers-reduced-motion: reduce){
  .float,.star-tw,.cloud,.sun-halo{animation:none!important}
  .beat{animation:beatcalm 3.8s ease-in-out infinite}
  @keyframes beatcalm{0%,100%{transform:scale(1)}12%{transform:scale(1.015)}}
  .heart-glow{animation:glowcalm 3.8s ease-in-out infinite}
  @keyframes glowcalm{0%,100%{opacity:.7}12%{opacity:1}}
  .ripple{animation:ripplecalm 3.8s ease-in-out infinite}
  .ripple.r2{animation-delay:1.9s}
  @keyframes ripplecalm{0%{opacity:0}18%{opacity:.28}100%{opacity:0}}
  .ignition{display:none}
  .heart-anchor{transition:opacity 1.4s ease .1s}
  .ph-dawn .heart-anchor{transform:translate(-50%,-50%) scale(.94)}
  .sky-dawn{transition-duration:2.8s}
  .sky-day{transition-duration:3.2s}
  .sun-wrap{transform:translate(-50%,-50%) translateY(12vh) scale(.97);
    transition:transform 2.6s cubic-bezier(.3,.4,.3,1), opacity 1.8s ease .4s}
  .bird-track{animation-duration:46s!important;animation-timing-function:linear!important}
  .bird-bob,.bird-wing{animation:none!important}
  .m-label,.m-name{transform:none;filter:none}
  .m-label{transition:opacity 1.6s ease .2s}
  .m-name{transition:opacity 1.8s ease .6s}
  .m-divider path{stroke-dasharray:none;stroke-dashoffset:0;transition:none}
  .hills-warm,.haze,.horizon-glow{transition-duration:3s}
}
</style>
</head>
<body>
<main id="scene" data-phase="night" aria-label="An interactive good-morning scene for Rakhi. A heart beats in the night sky; touch it to bring the morning.">

  <div class="sky sky-night" aria-hidden="true"></div>
  <div class="sky sky-dawn" aria-hidden="true"></div>
  <div class="sky sky-day" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <svg class="stars" id="stars" aria-hidden="true"></svg>
  <svg class="meteors" id="meteors" aria-hidden="true"></svg>

  <div class="horizon-glow" aria-hidden="true"></div>

  <div class="sun-wrap" id="sunWrap" aria-hidden="true">
    <div class="sun-halo"></div>
    <svg class="sun-svg" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <radialGradient id="sunFill" cx="50%" cy="46%" r="60%">
          <stop offset="0%" stop-color="#fff8e6"/>
          <stop offset="55%" stop-color="#ffdda6"/>
          <stop offset="100%" stop-color="#ffb369"/>
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="22" fill="url(#sunFill)"/>
    </svg>
  </div>

  <div class="cloud c1" aria-hidden="true"></div>
  <div class="cloud c2" aria-hidden="true"></div>
  <div class="cloud c3" aria-hidden="true"></div>

  <div class="hills" aria-hidden="true">
    <svg class="hills-base" viewBox="0 0 100 24" preserveAspectRatio="none">
      <path d="M0 13.2 C 12 8.4 26 7.6 38 10.8 C 50 14 62 14.8 74 11 C 84 7.8 93 9.6 100 12.2 L100 24 L0 24 Z" fill="#141a3c"/>
      <path d="M0 18.2 C 14 14.2 26 15 40 17.6 C 56 20.6 70 19.2 82 16.6 C 90 14.9 96 15.6 100 17 L100 24 L0 24 Z" fill="#0a0e26"/>
    </svg>
    <svg class="hills-warm" viewBox="0 0 100 24" preserveAspectRatio="none">
      <path d="M0 13.2 C 12 8.4 26 7.6 38 10.8 C 50 14 62 14.8 74 11 C 84 7.8 93 9.6 100 12.2 L100 24 L0 24 Z" fill="#8a6f80"/>
      <path d="M0 18.2 C 14 14.2 26 15 40 17.6 C 56 20.6 70 19.2 82 16.6 C 90 14.9 96 15.6 100 17 L100 24 L0 24 Z" fill="#5c4b62"/>
    </svg>
  </div>
  <div class="haze" aria-hidden="true"></div>

  <div class="heart-anchor" id="heartAnchor">
    <div class="heart-parallax" id="heartParallax">
      <div class="heart-glow" id="heartGlow" aria-hidden="true"></div>
      <svg class="heart-svg" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="heartFill" cx="40%" cy="34%" r="78%">
            <stop offset="0%" stop-color="#ffb1c0"/>
            <stop offset="42%" stop-color="#ef7d97"/>
            <stop offset="100%" stop-color="#c2395c"/>
          </radialGradient>
        </defs>
        <g class="ripple-set">
          <circle class="ripple" cx="100" cy="94" r="80" vector-effect="non-scaling-stroke"/>
          <circle class="ripple r2" cx="100" cy="94" r="80" vector-effect="non-scaling-stroke"/>
          <circle class="ripple-strong" id="rippleStrong" cx="100" cy="94" r="80" vector-effect="non-scaling-stroke"/>
        </g>
        <g class="float">
          <g class="beat" id="beatG">
            <path fill="url(#heartFill)" d="M100 172 C 48 132 16 96 16 60 C 16 32 38 16 62 16 C 80 16 94 26 100 42 C 106 26 120 16 138 16 C 162 16 184 32 184 60 C 184 96 152 132 100 172 Z"/>
            <path d="M47 46 C 51 33 63 26 76 30" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="7" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
      <button id="heartHit" class="heart-hit" type="button"
        aria-label="A heart is beating quietly in the night. Touch it to bring the morning."></button>
    </div>
  </div>

  <div class="ignition" id="ignition" aria-hidden="true"></div>

  <svg class="birds" id="birds" aria-hidden="true"></svg>

  <p class="cue" aria-hidden="true">Touch me</p>

  <section class="message">
    <h1 class="m-title">
      <span class="m-label">Good morning</span>
      <span class="m-name">Rakhi</span>
    </h1>
    <svg class="m-divider" viewBox="0 0 40 36" aria-hidden="true">
      <path pathLength="120" d="M20 31 C 11.5 24.5 5 19 5 12.2 C 5 7.4 8.6 4.5 12.6 4.5 C 15.8 4.5 18.4 6.2 20 9 C 21.6 6.2 24.2 4.5 27.4 4.5 C 31.4 4.5 35 7.4 35 12.2 C 35 19 28.5 24.5 20 31 Z"/>
    </svg>
  </section>

  <button id="fsBtn" class="fs-btn" type="button" aria-label="Enter fullscreen">
    <svg id="fsExpand" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
    <svg id="fsCompress" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M9 4v5H4M20 9h-5V4M4 15h5v5M15 20v-5h5"/></svg>
  </button>

  <p class="sr-only" aria-live="polite" id="liveMsg"></p>
</main>

<noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#0a0e22;font-family:Georgia,serif;font-style:italic;font-size:28px;color:#f3e6d8">Good Morning, Rakhi</div></noscript>

<script>
(() => {
"use strict";
const SVGNS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const scene = $("scene");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const el = (n, attrs) => { const e = document.createElementNS(SVGNS, n); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

/* ---------- state machine ---------- */
let phase = "night";
const themeMeta = $("themeMeta");
const setTheme = c => { try { themeMeta.setAttribute("content", c); } catch (e) {} };
function setPhase(p) { phase = p; scene.dataset.phase = p; scene.classList.add("ph-" + p); }

/* ---------- stars ---------- */
const starsSvg = $("stars");
function buildStars() {
  const w = innerWidth, h = innerHeight;
  starsSvg.textContent = "";
  const count = Math.round(Math.min(110, Math.max(44, (w * h) / 8600)));
  for (let i = 0; i < count; i++) {
    const o = +(0.22 + Math.random() * 0.62).toFixed(2);
    const c = el("circle", {
      cx: (Math.random() * w).toFixed(1),
      cy: (Math.random() * h * 0.78).toFixed(1),
      r: (0.4 + Math.pow(Math.random(), 2.1) * 1.3).toFixed(2),
      class: "star" + (Math.random() < 0.45 ? " star-tw" : "")
    });
    c.style.opacity = o;
    c.style.setProperty("--o", o);
    c.style.setProperty("--td", (3.4 + Math.random() * 4.4).toFixed(2) + "s");
    c.style.setProperty("--tdel", (-Math.random() * 7).toFixed(2) + "s");
    starsSvg.appendChild(c);
  }
}

/* ---------- meteors ---------- */
const meteorSvg = $("meteors");
let meteorId = 0, meteorTimer = null;
function spawnMeteor() {
  const w = innerWidth, h = innerHeight;
  const id = ++meteorId;
  const len = 64 + Math.random() * 66;
  const a = 20 + Math.random() * 22;
  const rot = Math.random() < 0.55 ? a : 180 - a;
  const rad = rot * Math.PI / 180;
  const x0 = w * (0.12 + Math.random() * 0.76);
  const y0 = h * (0.03 + Math.random() * 0.32);
  const dist = Math.min(w, h) * (0.34 + Math.random() * 0.3) + 90;
  const g = el("g", {});
  g.innerHTML =
    `<defs><linearGradient id="mg${id}" gradientUnits="userSpaceOnUse" x1="${-len}" y1="0" x2="0" y2="0">` +
    `<stop offset="0" stop-color="#ffd9a0" stop-opacity="0"/>` +
    `<stop offset=".6" stop-color="#ffe6bd" stop-opacity=".5"/>` +
    `<stop offset="1" stop-color="#fff6e3" stop-opacity=".95"/></linearGradient></defs>` +
    `<line x1="${-len}" y1="0" x2="-1.5" y2="0" stroke="url(#mg${id})" stroke-width="${(0.9 + Math.random() * 0.7).toFixed(2)}" stroke-linecap="round"/>` +
    `<circle r="3.1" fill="rgba(255,214,150,.35)"/><circle r="1.4" fill="#fff4de"/>`;
  meteorSvg.appendChild(g);
  const p = f => `translate(${(x0 + Math.cos(rad) * dist * f).toFixed(1)}px, ${(y0 + Math.sin(rad) * dist * f).toFixed(1)}px) rotate(${rot}deg) scale(${(1 - 0.5 * f).toFixed(3)})`;
  const anim = g.animate([
    { transform: p(0),    opacity: 0 },
    { transform: p(0.08), opacity: 0.95, offset: 0.08 },
    { transform: p(0.62), opacity: 0.85, offset: 0.62 },
    { transform: p(1),    opacity: 0 }
  ], { duration: 900 + Math.random() * 620, easing: "cubic-bezier(.5,.05,.82,.42)", fill: "forwards" });
  anim.onfinish = () => g.remove();
}
function scheduleMeteor(delay) {
  meteorTimer = setTimeout(() => {
    if (phase === "night" && !REDUCED) spawnMeteor();
    scheduleMeteor(3200 + Math.random() * 5200);
  }, delay);
}

/* ---------- audio core ---------- */
let AC = null, master = null, heartGain = null, hbTimer = null, swellDone = false;
function ensureAudio() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return false;
    try {
      AC = new C();
      master = AC.createGain(); master.gain.value = 1; master.connect(AC.destination);
      heartGain = AC.createGain(); heartGain.gain.value = 0.13; heartGain.connect(master);
    } catch (e) { AC = null; return false; }
  }
  if (AC.state === "suspended") AC.resume().catch(() => {});
  return true;
}
function thump(t, f0, vol, dur) {
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = "sine";
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(28, f0 * 0.52), t + dur);
  f.type = "lowpass"; f.frequency.setValueAtTime(190, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(heartGain);
  o.start(t); o.stop(t + dur + 0.06);
}
function heartbeat(vol) {
  if (!AC || AC.state !== "running") return;
  const t = AC.currentTime + 0.02;
  thump(t, 55, vol, 0.19);
  thump(t + 0.34, 44, vol * 0.7, 0.27);
}
function syncBeat() {
  [$("beatG"), $("heartGlow")].forEach(n => {
    if (!n) return;
    n.style.animation = "none";
    n.getBoundingClientRect();
    n.style.animation = "";
  });
}
function unlockAudio(strong) {
  if (!ensureAudio()) return;
  if (!hbTimer) {
    syncBeat();
    hbTimer = setInterval(() => heartbeat(0.9), 1900);
    const first = () => heartbeat(strong ? 1.25 : 0.85);
    if (AC.state === "running") first();
    else AC.addEventListener("statechange", function oc() {
      if (AC.state === "running") { AC.removeEventListener("statechange", oc); first(); }
    });
  }
}
function fadeHeartbeat() {
  if (AC && heartGain) {
    const t = AC.currentTime;
    heartGain.gain.cancelScheduledValues(t);
    heartGain.gain.setValueAtTime(heartGain.gain.value, t);
    heartGain.gain.linearRampToValueAtTime(0.0001, t + 6);
  }
  setTimeout(() => { if (hbTimer) { clearInterval(hbTimer); hbTimer = null; } }, 6300);
}
function morningSwell() {
  if (!AC || swellDone) return; swellDone = true;
  const t = AC.currentTime;
  const buf = AC.createBuffer(1, 2 * AC.sampleRate, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = "lowpass";
  f.frequency.setValueAtTime(160, t); f.frequency.linearRampToValueAtTime(420, t + 6);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.035, t + 4.5);
  g.gain.linearRampToValueAtTime(0.0001, t + 16);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t); src.stop(t + 16.5);
}

/* ---------- music: audio file loader & player ---------- */
let musicAudio = null;

function startMusic() {
  if (musicAudio) return;
  try {
    musicAudio = new Audio('assets/audio/morning-music.mp3');
    musicAudio.loop = true;
    musicAudio.preload = 'auto';
    musicAudio.volume = 0;

    const playPromise = musicAudio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        const fadeIn = setInterval(() => {
          if (!musicAudio) { clearInterval(fadeIn); return; }
          if (musicAudio.volume < 0.85) {
            musicAudio.volume = Math.min(0.85, musicAudio.volume + 0.03);
          } else {
            clearInterval(fadeIn);
          }
        }, 80);
      }).catch(err => {
        console.warn("Audio playback waiting for interaction:", err);
      });
    }
  } catch (e) {
    console.warn("Audio load error:", e);
  }
}

function musicSwell() {
  if (!musicAudio) return;
  const target = Math.min(1.0, musicAudio.volume + 0.15);
  const swell = setInterval(() => {
    if (!musicAudio) { clearInterval(swell); return; }
    if (musicAudio.volume < target) {
      musicAudio.volume = Math.min(target, musicAudio.volume + 0.01);
    } else {
      clearInterval(swell);
    }
  }, 60);
}

/* ---------- haptics ---------- */
const canVibrate = "vibrate" in navigator;
function haptic(p) { if (!canVibrate) return; try { navigator.vibrate(p); } catch (e) {} }

/* ---------- birds ---------- */
const birdsSvg = $("birds");
const BIRDS = [
  { y: .155, s: 1.00, d: 12.5, del: 0.0, dir: 1,  fd: .82, o: .85 },
  { y: .235, s: .76,  d: 15.0, del: 0.9, dir: 1,  fd: .96, o: .70 },
  { y: .200, s: .62,  d: 17.5, del: 1.9, dir: -1, fd: .72, o: .60 },
  { y: .300, s: .90,  d: 13.5, del: 2.7, dir: 1,  fd: .88, o: .80 },
  { y: .120, s: .55,  d: 19.5, del: 3.6, dir: -1, fd: .68, o: .50 }
];
function buildBirds() {
  const w = innerWidth, h = innerHeight;
  birdsSvg.textContent = "";
  BIRDS.forEach(b => {
    const base = el("g", { transform: `translate(0 ${(b.y * h).toFixed(1)})`, opacity: b.o });
    const track = el("g", { class: "bird-track" });
    const x0 = b.dir === 1 ? -70 : w + 70;
    const x1 = b.dir === 1 ? w + 90 : -90;
    track.style.setProperty("--x0", x0 + "px");
    track.style.setProperty("--x1", x1 + "px");
    track.style.setProperty("--fdur", b.d + "s");
    track.style.setProperty("--fdel", b.del + "s");
    const bob = el("g", { class: "bird-bob" });
    bob.style.setProperty("--bd", (2.4 + Math.random() * 1.2).toFixed(2) + "s");
    bob.style.setProperty("--bdel", (-Math.random() * 3).toFixed(2) + "s");
    const size = el("g", { transform: `scale(${b.s})` });
    const wing = el("path", { class: "bird-wing", d: "M-11 0 Q -5 -6.2 0 -1.6 Q 5 -6.2 11 0" });
    wing.style.setProperty("--wd", b.fd + "s");
    size.appendChild(wing); bob.appendChild(size); track.appendChild(bob); base.appendChild(track);
    birdsSvg.appendChild(base);
  });
}

/* ---------- interaction ---------- */
let started = false;
const hit = $("heartHit");
const sunWrap = $("sunWrap");
const liveMsg = $("liveMsg");

function strongRipple() {
  const c = $("rippleStrong");
  const a = c.animate(
    [{ transform: "scale(.42)", opacity: .8 }, { transform: "scale(2.35)", opacity: 0 }],
    { duration: REDUCED ? 900 : 1500, easing: "cubic-bezier(.18,.6,.25,1)" }
  );
  a.onfinish = () => { c.style.opacity = 0; };
}

function ignite() {
  if (started) return;
  started = true;
  setPhase("touch");
  haptic([9, 90, 14]);
  unlockAudio(true);
  startMusic();
  hit.disabled = true;
  const beatEl = $("beatG");
  if (!REDUCED) {
    beatEl.animate(
      [{ transform: "scale(1)" }, { transform: "scale(1.13)", offset: .28 },
       { transform: "scale(.99)", offset: .55 }, { transform: "scale(1.05)", offset: .8 },
       { transform: "scale(1)" }],
      { duration: 760, easing: "cubic-bezier(.3,.1,.3,1)" }
    );
    $("ignition").animate(
      [{ opacity: 0, transform: "translate(-50%,-50%) scale(.35)" },
       { opacity: .5, offset: .25 },
       { opacity: 0, transform: "translate(-50%,-50%) scale(1.12)" }],
      { duration: 1150, easing: "cubic-bezier(.2,.5,.3,1)" }
    );
  }
  strongRipple();
  runTransition();
}

function runTransition() {
  const T = (fn, ms) => setTimeout(fn, ms);
  const R = REDUCED;
  T(() => { setPhase("dawn"); setTheme("#241b42"); if (meteorTimer) clearTimeout(meteorTimer); }, R ? 150 : 380);
  T(() => sunWrap.classList.add("rise"), R ? 500 : 2300);
  T(() => morningSwell(), R ? 800 : 3300);
  T(() => birdsSvg.classList.add("on"), R ? 1200 : 4400);
  T(() => { setPhase("morning"); setTheme("#ffe0b4"); }, R ? 1600 : 6400);
  T(() => { setPhase("message"); musicSwell(); liveMsg.textContent = "Good morning, Rakhi."; setTheme("#ffe6c0"); }, R ? 2600 : 9600);
  T(() => { setPhase("complete"); fadeHeartbeat(); }, R ? 4200 : 12200);
}

hit.addEventListener("pointerdown", ignite);
hit.addEventListener("click", ignite);
hit.addEventListener("contextmenu", e => e.preventDefault());

addEventListener("pointerdown", () => { if (!started) unlockAudio(false); }, { passive: true });

/* ---------- pointer proximity (mouse only) ---------- */
const parallax = $("heartParallax");
if (matchMedia("(pointer:fine)").matches && !REDUCED) {
  let px = 0, py = 0, tx = 0, ty = 0, rafId = null;
  const loop = () => { rafId = requestAnimationFrame(() => {
    px += (tx - px) * 0.06; py += (ty - py) * 0.06;
    parallax.style.transform = `translate(${px.toFixed(2)}px, ${py.toFixed(2)}px)`;
    if (Math.abs(tx - px) > 0.05 || Math.abs(ty - py) > 0.05) loop(); else rafId = null;
  }); };
  addEventListener("pointermove", e => {
    if (e.pointerType && e.pointerType !== "mouse") return;
    if (started) { tx = 0; ty = 0; }
    else {
      tx = Math.max(-8, Math.min(8, (e.clientX - innerWidth / 2) / innerWidth * 22));
      ty = Math.max(-6, Math.min(6, (e.clientY - innerHeight * 0.38) / innerHeight * 20));
    }
    if (!rafId) loop();
  }, { passive: true });
}

/* ---------- fullscreen ---------- */
const fsBtn = $("fsBtn"), fsExpand = $("fsExpand"), fsCompress = $("fsCompress");
const fsReq = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
if (!fsReq) fsBtn.style.display = "none";
function fsUI() {
  const active = !!(document.fullscreenElement || document.webkitFullscreenElement);
  fsExpand.style.display = active ? "none" : "block";
  fsCompress.style.display = active ? "block" : "none";
  fsBtn.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
}
fsBtn.addEventListener("click", async () => {
  ensureAudio();
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      const ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (ex) await ex.call(document);
    } else if (fsReq) {
      await fsReq.call(document.documentElement);
    }
  } catch (e) {}
});
document.addEventListener("fullscreenchange", fsUI);
document.addEventListener("webkitfullscreenchange", fsUI);
fsUI();

/* ---------- init & resize ---------- */
buildStars();
buildBirds();
scheduleMeteor(1600);
let rt = null;
addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    buildStars();
    if (!birdsSvg.classList.contains("on")) buildBirds();
  }, 260);
});
})();
</script>
</body>
</html>
